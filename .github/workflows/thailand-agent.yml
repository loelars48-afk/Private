name: Thailand-agent

on:
  schedule:
    # To ganger daglig (UTC): ca. 07:17 og 19:17 norsk vintertid
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      antall:
        description: "Antall søk denne kjøringen (tomt = fra config.json)"
        required: false

permissions:
  contents: write

concurrency:
  group: thailand-agent
  cancel-in-progress: false

jobs:
  sok:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kjør tester
        run: python -m unittest discover -s tests

      - name: Søk etter reiser
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.antall }}" ]; then
            python thailand_agent.py --antall "${{ github.event.inputs.antall }}"
          else
            python thailand_agent.py
          fi

      - name: Vis rapport i kjøringsoversikten
        if: always()
        run: '[ -f RAPPORT.md ] && cat RAPPORT.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Lagre resultater i repoet
        run: |
          git config user.name "thailand-agent"
          git config user.email "thailand-agent@users.noreply.github.com"
          git add RAPPORT.md data/
          if git diff --cached --quiet; then
            echo "Ingen endringer."
          else
            git commit -m "Thailand-agent: oppdatert rapport $(date -u +%F\ %H:%M)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
